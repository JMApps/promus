name: Android Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Восстановить ключ подписи
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/promus.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=promus.jks
          EOF

      - run: flutter pub get

      - name: Собрать APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          flutter build apk --release --split-per-abi \
            --build-name=$VERSION \
            --build-number=${{ github.run_number }} \
            --obfuscate --split-debug-info=build/debug-info

      - name: Переименовать файлы
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   ProMus-arm64.apk
          mv app-armeabi-v7a-release.apk ProMus-armv7.apk

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/ProMus-arm64.apk
            build/app/outputs/flutter-apk/ProMus-armv7.apk
          generate_release_notes: true