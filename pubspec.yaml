name: promus
description: "Provision of the Muslim"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  adhan: ^2.0.0+1
  flutter_html: ^3.0.0
  salomon_bottom_bar: ^3.3.2
  scrollable_positioned_list: ^0.3.8
  flutter_material_color_picker: ^1.2.0
  syncfusion_flutter_datepicker: ^34.2.4
  home_widget: ^0.9.3
  sqflite: ^2.4.3
  hijri: ^3.0.1
  intl: ^0.20.3
  timezone: ^0.11.1
  cron: ^0.6.2
  wakelock_plus: ^1.7.0
  url_launcher: ^6.3.2
  flutter_compass: ^0.8.1
  vibration: ^3.2.0
  flutter_local_notifications: ^22.3.0
  hive_ce: ^2.19.3
  path_provider: ^2.1.6
  equatable: ^2.1.0
  provider: ^6.1.5+1
  easy_stepper: ^1.2.0
  sleek_circular_slider: ^2.1.0
  path: ^1.9.1
  share_plus: ^13.3.0
  pasteboard: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  very_good_analysis: ^10.3.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/databases/

  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/uthmanic_hafs_v_22.ttf
    - family: PT Sans
      fonts:
        - asset: assets/fonts/pt_sans_regular.ttf
    - family: QCF_BSML
      fonts:
        - asset: assets/fonts/qcf_bsml.ttf
    - family: Juz name
      fonts:
        - asset: assets/fonts/juz_name.ttf
    - family: Surah name v4
      fonts:
        - asset: assets/fonts/surah_name_v4.ttf
    - family: Noto Naskh
      fonts:
        - asset: assets/fonts/noto_naskh.ttf